<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pxiify</title>
  <meta name="description" content="Pxiify's personal website.">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
    }

    /* Hazard stripe header */
    .header {
      background: repeating-linear-gradient(
        45deg,
        #f2e600,
        #f2e600 40px,
        #111 40px,
        #111 80px
      );
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .header h1 {
      color: #d861d8;
      font-size: 90px;
      font-weight: 900;
      text-align: center;
      -webkit-text-stroke: 1px #000;
    }

    /* Rainy dark background section */
    .main {
      min-height: 100vh;
      background: linear-gradient(to bottom, #4a2b52 0%, #1a1a2e 25%, #0d1b2a 100%);
      padding-top: 80px;
    }

    /* Nav buttons */
    .nav {
      display: flex;
      justify-content: center;
      gap: 30px;
      flex-wrap: wrap;
    }

    .nav a {
      text-decoration: none;
      font-size: 34px;
      color: #1a1a1a;
      padding: 30px 50px;
      border: 4px solid;
      border-radius: 4px;
    }

    .btn-blue {
      background-color: #4da6d9;
      border-color: #1c4d66;
    }

    .btn-green {
      background-color: #8bc34a;
      border-color: #2e5c1a;
    }

    .btn-orange {
      background-color: #e8996b;
      border-color: #b35c1e;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>Still making</h1>
  </div>

  <div class="main">
    <div class="nav">
      <a href="#" class="btn-blue">Other</a>
      <a href="#" class="btn-green">Home</a>
      <a href="#" class="btn-orange">Other</a>
    </div>
  </div>

</body>
</html>
