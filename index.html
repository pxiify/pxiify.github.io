<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pxiify</title>
  <meta name="description" content="Pxiify's personal website.">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      overflow-x: hidden;
    }

    /* Hazard stripe header */
    .header {
      background: repeating-linear-gradient(
        45deg,
        #f2e600,
        #f2e600 40px,
        #111 40px,
        #111 80px
      );
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .header h1 {
      color: #d861d8;
      font-size: 90px;
      font-weight: 900;
      text-align: center;
      -webkit-text-stroke: 1px #000;
    }

    /* Rainy dark background section - cycles through gradients */
    .main {
      position: relative;
      min-height: 100vh;
      padding-top: 80px;
      overflow: hidden;
      transition: background 2s ease-in-out;
      background: linear-gradient(to bottom, #4a2b52 0%, #1a1a2e 25%, #0d1b2a 100%);
    }

    .main.bg-1 { background: linear-gradient(to bottom, #4a2b52 0%, #1a1a2e 25%, #0d1b2a 100%); }
    .main.bg-2 { background: linear-gradient(to bottom, #1f2937 0%, #0f172a 30%, #020617 100%); }
    .main.bg-3 { background: linear-gradient(to bottom, #374151 0%, #1e293b 30%, #0c0a1a 100%); }
    .main.bg-4 { background: linear-gradient(to bottom, #3b2f4a 0%, #201a35 30%, #0a0a14 100%); }
    .main.bg-5 { background: linear-gradient(to bottom, #2d3436 0%, #182226 30%, #05080a 100%); }
    .main.bg-6 { background: linear-gradient(to bottom, #4b3b52 0%, #241f38 30%, #0d0d1a 100%); }

    /* Animated rain effect - falling diagonal lines */
    .rain {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      background-image: repeating-linear-gradient(
        70deg,
        transparent 0,
        transparent 40px,
        rgba(255, 255, 255, 0.18) 41px,
        transparent 43px
      );
      background-size: 120px 100%;
      animation: rainFall 0.4s linear infinite;
    }

    @keyframes rainFall {
      0% { background-position: 0 -100px; }
      100% { background-position: -40px 100px; }
    }

    /* Nav buttons */
    .nav {
      position: relative;
      display: flex;
      justify-content: center;
      gap: 30px;
      flex-wrap: wrap;
      z-index: 2;
    }

    .nav a {
      text-decoration: none;
      font-size: 34px;
      color: #1a1a1a;
      padding: 30px 50px;
      border: 4px solid;
      border-radius: 4px;
      display: inline-block;
      transition: transform 0.2s ease-in-out, box-shadow 0.2s ease-in-out;
    }

    .nav a:hover {
      transform: scale(1.12);
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.4);
    }

    .btn-blue {
      background-color: #4da6d9;
      border-color: #1c4d66;
    }

    .btn-green {
      background-color: #8bc34a;
      border-color: #2e5c1a;
    }

    .btn-orange {
      background-color: #e8996b;
      border-color: #b35c1e;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>Still making</h1>
  </div>

  <div class="main bg-1" id="mainBg">
    <div class="rain"></div>
    <div class="nav">
      <a href="#" class="btn-blue">Other</a>
      <a href="home.html" class="btn-green">Home</a>
      <a href="#" class="btn-orange">Other</a>
    </div>
  </div>

  <script>
    const bgClasses = ["bg-1", "bg-2", "bg-3", "bg-4", "bg-5", "bg-6"];
    let bgIndex = 0;
    const mainEl = document.getElementById("mainBg");

    setInterval(() => {
      mainEl.classList.remove(bgClasses[bgIndex]);
      bgIndex = (bgIndex + 1) % bgClasses.length;
      mainEl.classList.add(bgClasses[bgIndex]);
    }, 60000); // changes every 1 minute
  </script>

</body>
</html>
